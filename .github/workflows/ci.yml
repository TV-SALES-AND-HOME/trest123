name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: TV-SALES-AND-HOME/infrastructure/.github/workflows/reusable-nextjs-ci.yml@main
  security:
    uses: TV-SALES-AND-HOME/infrastructure/.github/workflows/reusable-security.yml@main
