name: Security

on:
  push:
    branches: ['main', 'staging', 'develop']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
        # Remaining findings require a Next.js 14 -> 16 major upgrade (breaking
        # change, tracked separately). continue-on-error keeps the scan visible
        # without blocking CI until that upgrade lands.
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        # Note: Full enforcement requires GitHub Advanced Security (GHAS).
        # continue-on-error: true ensures PRs are not blocked on GitHub Free plan.
        # Remove continue-on-error when GHAS is enabled.

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        # Note: SARIF upload requires GitHub Advanced Security.
        # The scan still runs and logs findings.
